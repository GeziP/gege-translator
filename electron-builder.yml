appId: com.gezip.translator
productName: 鸽鸽翻译
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Gege-Translator-${version}-Windows-${arch}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
