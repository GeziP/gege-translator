name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Capture sample screenshots
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "node_modules/electron/dist/electron.exe" -ArgumentList "scripts/capture-screenshots.cjs" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Screenshot capture failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: sample-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "node_modules/electron/dist/electron.exe" -ArgumentList "out/main/index.js", "--smoke-test" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed: $($process.ExitCode)" }
      - run: npx electron-builder --win --x64 --publish never
      - name: Smoke test installed app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'previous-setup'
          New-Item -ItemType Directory -Path $previous | Out-Null
          gh release download v0.1.0-beta.4 --repo GeziP/gege-translator --pattern '*-Setup.exe' --dir $previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download previous installer' }
          $oldInstaller = Get-ChildItem "$previous/*-Setup.exe" | Select-Object -First 1
          $oldInstall = Start-Process -FilePath $oldInstaller.FullName -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
          if ($oldInstall.ExitCode -ne 0) { throw 'Previous version installation failed' }
          $dataPath = Join-Path $env:APPDATA 'gege-translator'
          New-Item -ItemType Directory -Force -Path $dataPath | Out-Null
          Set-Content -LiteralPath (Join-Path $dataPath 'terms.json') -Value '[{"source":"example","target":"示例","meaning":"","domain":"ivd","sourceLanguage":"en","targetLanguage":"zh-CN"}]' -Encoding utf8
          $installer = Get-ChildItem release/*-Setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $app = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter "鸽鸽翻译.exe" -Recurse | Select-Object -First 1
          if (-not $app) { throw "Installed executable not found" }
          $run = Start-Process -FilePath $app.FullName -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru -Wait
          if ($run.ExitCode -ne 0) { throw "Installed app failed: $($run.ExitCode)" }
          $terms = Get-Content -LiteralPath (Join-Path $dataPath 'terms.json') -Raw | ConvertFrom-Json
          if ($terms[0].source -ne 'example') { throw 'Existing glossary was not preserved' }
      - uses: actions/upload-artifact@v4
        with:
          name: gege-translator-windows
          path: release/*-Setup.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release/*-Setup.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName --title "鸽鸽翻译 $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
