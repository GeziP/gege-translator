name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "node_modules/electron/dist/electron.exe" -ArgumentList "out/main/index.js", "--smoke-test" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed: $($process.ExitCode)" }
      - run: npx electron-builder --win --x64 --publish never
      - name: Smoke test installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-Setup.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $app = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter "Gege Translator.exe" -Recurse | Select-Object -First 1
          if (-not $app) { throw "Installed executable not found" }
          $run = Start-Process -FilePath $app.FullName -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru -Wait
          if ($run.ExitCode -ne 0) { throw "Installed app failed: $($run.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: gege-translator-windows
          path: release/*-Setup.exe
          if-no-files-found: error
      - name: Publish test release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release/*-Setup.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName --title "译间 $env:GITHUB_REF_NAME 测试版" --notes-file RELEASE-NOTES.md --prerelease --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
